<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dashboard</title>
    <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <button id="menuToggleBtn" class="menu-toggle-btn">▶</button>
        <div class="topbar-title">Job Board System</div>
    </div>
</div>

<div class="layout">
    <aside id="sidebar" class="sidebar hidden">
        <div class="sidebar-menu">
            <div class="menu-item active">Dashboard</div>
            <div class="menu-item" onclick="location.href='/admin-users.html'">User Management</div>
            <div class="menu-item">Job Management</div>
            <div class="menu-item">Company Management</div>
            <div class="menu-item">Platform Monitoring</div>
            <div class="menu-item">Analytics</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Dashboard</h1>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card large-card">
                <div class="card-title">Total Users</div>
                <div class="card-value" id="totalUsers">0</div>
                <div class="sub-stats">
                    <span>Students: <strong id="totalStudents">0</strong></span>
                    <span>Employers: <strong id="totalEmployers">0</strong></span>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-title">Total Jobs</div>
                <div class="card-value" id="totalJobs">0</div>
            </div>

            <div class="dashboard-card">
                <div class="card-title">Total Applications</div>
                <div class="card-value" id="totalApplications">0</div>
            </div>

            <div class="dashboard-card">
                <div class="card-title">New Jobs Today</div>
                <div class="card-value" id="newJobsToday">0</div>
            </div>

            <div class="dashboard-card">
                <div class="card-title">New Applications Today</div>
                <div class="card-value" id="newApplicationsToday">0</div>
            </div>

            <div class="dashboard-card">
                <div class="card-title">Active Users</div>
                <div class="card-value" id="activeUsers">0</div>
            </div>
        </div>
    </main>
</div>

<script src="/js/admin-dashboard.js"></script>
</body>
</html>
