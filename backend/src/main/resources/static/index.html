<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #123f7a;
            color: white;
            padding: 18px 30px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        .token-box {
            margin-bottom: 20px;
        }

        input {
            width: 500px;
            padding: 8px;
        }

        button {
            padding: 8px 14px;
            margin-left: 8px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-height: 320px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        canvas {
            width: 100%;
            height: 250px;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            background: #eef3f8;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="header">
    Job Board System - Analytics Test
</div>

<div class="container">

    <h1>Analytics</h1>

    <div class="token-box">
        <label>Admin Token:</label>
        <input id="tokenInput" placeholder="Paste admin token here">
        <button onclick="saveToken()">Save Token</button>
        <button onclick="loadAnalytics()">Load Analytics</button>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Job Growth Trend</h3>
            <canvas id="jobGrowthChart"></canvas>
        </div>

        <div class="card">
            <h3>Position Distribution</h3>
            <canvas id="positionDistributionChart"></canvas>
        </div>

        <div class="card">
            <h3>Application Trend</h3>
            <canvas id="applicationTrendChart"></canvas>
        </div>

        <div class="card">
            <h3>Pending Review Count</h3>
            <canvas id="pendingReviewChart"></canvas>
        </div>

        <div class="card">
            <h3>Report Statistics</h3>
            <canvas id="reportStatisticsChart"></canvas>
        </div>

        <div class="card">
            <h3>Conversion Rate</h3>
            <canvas id="conversionRateChart"></canvas>
        </div>
    </div>

    <div id="message">Waiting for analytics data...</div>

</div>

<script>
    const baseUrl = "http://localhost:8080";

    let jobGrowthChart = null;
    let positionDistributionChart = null;
    let applicationTrendChart = null;
    let pendingReviewChart = null;
    let reportStatisticsChart = null;
    let conversionRateChart = null;

    window.onload = function () {
        const savedToken = localStorage.getItem("adminToken");
        if (savedToken) {
            document.getElementById("tokenInput").value = savedToken;
        }
    };

    function saveToken() {
        const token = document.getElementById("tokenInput").value.trim();

        if (!token) {
            alert("Please paste admin token first.");
            return;
        }

        localStorage.setItem("adminToken", token);
        document.getElementById("message").innerText = "Admin token saved.";
    }

    async function loadAnalytics() {
        const token = localStorage.getItem("adminToken") || document.getElementById("tokenInput").value.trim();

        if (!token) {
            alert("Please enter admin token.");
            return;
        }

        try {
            const response = await fetch(baseUrl + "/admin/analytics/overview?days=7", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const result = await response.json();

            console.log("Analytics API result:", result);

            if (!response.ok) {
                document.getElementById("message").innerText =
                    "Request failed:\n" + JSON.stringify(result, null, 2);
                return;
            }

            const data = result.data;

            drawJobGrowthChart(data.jobGrowthTrend || []);
            drawPositionDistributionChart(data.positionDistribution || []);
            drawApplicationTrendChart(data.applicationTrend || []);
            drawPendingReviewChart(data.pendingReviewCount || {});
            drawReportStatisticsChart(data.reportStatistics || []);
            drawConversionRateChart(data.conversionRate || {});

            document.getElementById("message").innerText =
                "Analytics data loaded successfully.\n\n" + JSON.stringify(data, null, 2);

        } catch (error) {
            console.error(error);
            document.getElementById("message").innerText = "Error: " + error.message;
        }
    }

    function drawJobGrowthChart(items) {
        destroyChart(jobGrowthChart);

        jobGrowthChart = new Chart(document.getElementById("jobGrowthChart"), {
            type: "line",
            data: {
                labels: items.map(item => item.date),
                datasets: [{
                    label: "New Jobs",
                    data: items.map(item => item.count),
                    tension: 0.3
                }]
            }
        });
    }

    function drawPositionDistributionChart(items) {
        destroyChart(positionDistributionChart);

        positionDistributionChart = new Chart(document.getElementById("positionDistributionChart"), {
            type: "doughnut",
            data: {
                labels: items.map(item => item.name),
                datasets: [{
                    label: "Positions",
                    data: items.map(item => item.value)
                }]
            }
        });
    }

    function drawApplicationTrendChart(items) {
        destroyChart(applicationTrendChart);

        applicationTrendChart = new Chart(document.getElementById("applicationTrendChart"), {
            type: "bar",
            data: {
                labels: items.map(item => item.date),
                datasets: [{
                    label: "Applications",
                    data: items.map(item => item.count)
                }]
            }
        });
    }

    function drawPendingReviewChart(item) {
        destroyChart(pendingReviewChart);

        pendingReviewChart = new Chart(document.getElementById("pendingReviewChart"), {
            type: "bar",
            data: {
                labels: ["Jobs", "Verifications", "Reports"],
                datasets: [{
                    label: "Pending Review",
                    data: [
                        item.pendingJobs || 0,
                        item.pendingVerifications || 0,
                        item.pendingReports || 0
                    ]
                }]
            }
        });
    }

    function drawReportStatisticsChart(items) {
        destroyChart(reportStatisticsChart);

        reportStatisticsChart = new Chart(document.getElementById("reportStatisticsChart"), {
            type: "pie",
            data: {
                labels: items.map(item => item.name),
                datasets: [{
                    label: "Reports",
                    data: items.map(item => item.value)
                }]
            }
        });
    }

    function drawConversionRateChart(item) {
        destroyChart(conversionRateChart);

        conversionRateChart = new Chart(document.getElementById("conversionRateChart"), {
            type: "bar",
            data: {
                labels: ["Applications / Job", "Acceptance Rate %"],
                datasets: [{
                    label: "Conversion Rate",
                    data: [
                        item.applicationPerJobRate || 0,
                        item.acceptanceRate || 0
                    ]
                }]
            }
        });
    }

    function destroyChart(chart) {
        if (chart) {
            chart.destroy();
        }
    }
</script>

</body>
</html>
