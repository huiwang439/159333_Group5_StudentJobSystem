<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Staff Login</h1>
        <p class="auth-subtitle">
            Sign in to access the staff panel.
        </p>

        <form id="staffLoginForm">
            <div class="form-group">
                <label class="form-label" for="staff-email">Email</label>
                <input class="form-input" id="staff-email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="staff-password">Password</label>
                <input class="form-input" id="staff-password" type="password" placeholder="Enter your password" required>
            </div>

            <button class="primary-btn" type="submit">Log In</button>
        </form>

        <p id="authMessage" style="margin-top: 12px;"></p>

        <div class="auth-footer">
            <a class="auth-link" href="./login.html">Back to role selection</a>
        </div>
    </div>
</div>

<script src="./js/api-client.js"></script>
<script src="./js/login-staff.js"></script>
</body>
</html>
