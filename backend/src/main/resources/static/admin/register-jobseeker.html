<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Register</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Job Seeker Register</h1>
        <p class="auth-subtitle">
            Create your account to start applying for jobs.
        </p>

        <form id="jobseekerRegisterForm">
            <div class="form-group">
                <label class="form-label" for="jobseeker-role">Role</label>
                <select class="form-select" id="jobseeker-role">
                    <option value="student" selected>Job Seeker</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-full-name">Full Name</label>
                <input class="form-input" id="jobseeker-full-name" type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-register-email">Email</label>
                <input class="form-input" id="jobseeker-register-email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-phone">Phone</label>
                <input class="form-input" id="jobseeker-phone" type="text" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-register-password">Password</label>
                <input class="form-input" id="jobseeker-register-password" type="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-confirm-password">Confirm Password</label>
                <input class="form-input" id="jobseeker-confirm-password" type="password" placeholder="Confirm your password" required>
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">

            <div class="form-group">
                <label class="form-label" for="jobseeker-university">University</label>
                <input class="form-input" id="jobseeker-university" type="text" placeholder="Enter your university" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-major">Major</label>
                <input class="form-input" id="jobseeker-major" type="text" placeholder="Enter your major" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-degree-level">Degree Level</label>
                <select class="form-select" id="jobseeker-degree-level" required>
                    <option value="">Select degree level</option>
                    <option value="Bachelor">Bachelor</option>
                    <option value="Master">Master</option>
                    <option value="PhD">PhD</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-graduation-year">Graduation Year</label>
                <input class="form-input" id="jobseeker-graduation-year" type="number" placeholder="e.g. 2026" min="1900" max="2100">
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-preferred-job-type">Preferred Job Type</label>
                <input class="form-input" id="jobseeker-preferred-job-type" type="text" placeholder="e.g. Full-time, Part-time, Internship">
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-preferred-location">Preferred Location</label>
                <input class="form-input" id="jobseeker-preferred-location" type="text" placeholder="Enter your preferred location">
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-skills">Skills</label>
                <input class="form-input" id="jobseeker-skills" type="text" placeholder="e.g. Java, SQL, React">
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-bio">Bio</label>
                <textarea class="form-input" id="jobseeker-bio" rows="4" placeholder="Write a short introduction about yourself"></textarea>
            </div>

            <div class="button-row">
                <a href="./login-jobseeker.html" class="secondary-btn" style="display:flex;align-items:center;justify-content:center;">Back</a>
                <button class="primary-btn" type="submit">Register Now</button>
            </div>
        </form>

        <p id="authMessage" style="margin-top: 12px;"></p>
    </div>
</div>

<script src="./js/api-client.js"></script>
<script src="./js/register-jobseeker.js"></script>
</body>
</html>
