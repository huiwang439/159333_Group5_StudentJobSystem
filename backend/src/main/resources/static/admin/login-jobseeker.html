<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Student Login</h1>
        <p class="auth-subtitle">
            Sign in to explore jobs and manage applications.
        </p>

        <form id="studentLoginForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input id="email" class="form-input" type="email" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input id="password" class="form-input" type="password" required>
            </div>

            <button class="primary-btn" type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Do not have an account?
            <a href="register-jobseeker.html">Register Now</a>
        </div>

        <p id="message"></p>
    </div>
</div>

<script>
    document.getElementById("studentLoginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const res = await fetch("http://localhost:8080/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const result = await res.json();

        if (result.code === 200) {
            localStorage.setItem("token", result.data.token);
            window.location.href = "/student/index.html";;
        } else {
            document.getElementById("message").innerText = result.message;
        }
    });
</script>
</body>
</html>
