<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Report Handling</title>
    <link rel="stylesheet" href="./css/admin-platform.css">
    <link rel="stylesheet" href="./css/admin-common.css">
    <link rel="stylesheet" href="./css/admin-ai-assistant.css">
</head>
<body data-page="report-handling">

<div class="topbar">
    <div class="topbar-left">
        <button id="menuToggleBtn" class="menu-toggle-btn">▶</button>
        <div class="topbar-title">Job Board System</div>
    </div>

    <button id="adminLogoutBtn" class="logout-btn">
        Logout
    </button>
</div>

<div class="layout">
    <aside id="sidebar" class="sidebar hidden">
        <div class="sidebar-menu">
            <div class="menu-item" onclick="location.href='./admin-dashboard.html'">Dashboard</div>

            <div class="menu-item" onclick="location.href='./admin-users.html'">User Management</div>

            <div class="menu-item" onclick="location.href='./admin-jobs.html'">Job Management</div>

            <div class="menu-group open">
                <div class="menu-item parent" data-href="./admin-company-verification.html">Company Management</div>
                <div class="sub-menu">
                    <div class="sub-menu-item" onclick="location.href='./admin-company-verification.html'">Company Verification</div>
                    <div class="sub-menu-item" onclick="location.href='./admin-company-info.html'">Company Information</div>
                </div>
            </div>

            <div class="menu-group open">
                <div class="menu-item parent active" data-href="./admin-report-handling.html">Platform Monitoring</div>
                <div class="sub-menu">
                    <div class="sub-menu-item active" onclick="location.href='./admin-report-handling.html'">Report Handling</div>
                    <div class="sub-menu-item" onclick="location.href='./admin-abnormal-monitoring.html'">Abnormal Data / Behavior</div>
                    <div class="sub-menu-item" onclick="location.href='./admin-daily-active.html'">Daily Active Users</div>
                </div>
            </div>

            <div class="menu-item" onclick="location.href='./admin-analytics.html'">Analytics</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1>Report Handling</h1>

            <div class="toolbar">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="reviewed">Reviewed</option>
                    <option value="resolved">Resolved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <button id="loadBtn">Load</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Reported User</th>
                    <th>Reason</th>
                    <th>Related Job</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>

            <pre id="messageBox"></pre>
        </div>
    </main>
</div>

<script src="./js/api-client.js"></script>
<script src="./js/admin-sidebar.js"></script>
<script src="./js/admin-report-handling.js"></script>
<script src="./js/admin-ai-assistant.js"></script>
<script src="./js/admin-logout.js"></script>
</body>
</html>
