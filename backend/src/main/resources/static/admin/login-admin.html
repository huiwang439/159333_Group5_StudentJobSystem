<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Admin Login</h1>
        <p class="auth-subtitle">
            Sign in to access the administration panel.
        </p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label class="form-label" for="admin-email">Email</label>
                <input class="form-input" id="admin-email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="admin-password">Password</label>
                <input class="form-input" id="admin-password" type="password" placeholder="Enter your password" required>
            </div>

            <button class="primary-btn" type="submit">Log In</button>
        </form>

        <p id="authMessage" style="margin-top: 12px;"></p>
    </div>
</div>

<script src="./js/api-client.js"></script>
<script src="./js/login-admin.js"></script>
</body>
</html>
