<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Employer Login</h1>
        <p class="auth-subtitle">
            Sign in to manage job postings and review applications.
        </p>

        <form id="employerLoginForm">
            <div class="form-group">
                <label class="form-label" for="employer-email">Email</label>
                <input class="form-input" id="employer-email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="employer-password">Password</label>
                <input class="form-input" id="employer-password" type="password" placeholder="Enter your password" required>
            </div>

            <button class="primary-btn" type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Do not have an account?
            <a class="auth-link" href="./register-employer.html">Register Now</a>
        </div>

        <p id="authMessage" style="margin-top: 12px;"></p>
    </div>
</div>

<script src="./js/api-client.js"></script>
<script src="./js/login-employer.js"></script>
</body>
</html>
