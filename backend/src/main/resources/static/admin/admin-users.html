<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="./css/admin-users.css">
    <link rel="stylesheet" href="./css/admin-common.css">
    <link rel="stylesheet" href="./css/admin-ai-assistant.css">
</head>
<body data-page="users">

<div class="topbar">
    <div class="topbar-left">
        <button id="menuToggleBtn" class="menu-toggle-btn">▶</button>
        <div class="topbar-title">Job Board System</div>
    </div>

    <button id="adminLogoutBtn" class="logout-btn">
        Logout
    </button>
</div>

<div class="layout">
    <aside id="sidebar" class="sidebar hidden">
        <div class="sidebar-menu">
            <div class="menu-item" onclick="location.href='./admin-dashboard.html'">Dashboard</div>

            <div class="menu-item active" onclick="location.href='./admin-users.html'">User Management</div>

            <div class="menu-item" onclick="location.href='./admin-jobs.html'">Job Management</div>

            <div class="menu-group open">
                <div class="menu-item parent" data-href="./admin-company-verification.html">Company Management</div>
                <div class="sub-menu">
                    <div class="sub-menu-item" onclick="location.href='./admin-company-verification.html'">Company Verification</div>
                    <div class="sub-menu-item" onclick="location.href='./admin-company-info.html'">Company Information</div>
                </div>
            </div>

            <div class="menu-group open">
                <div class="menu-item parent" data-href="./admin-report-handling.html">Platform Monitoring</div>
                <div class="sub-menu">
                    <div class="sub-menu-item" onclick="location.href='./admin-report-handling.html'">Report Handling</div>
                    <div class="sub-menu-item" onclick="location.href='./admin-abnormal-monitoring.html'">Abnormal Data / Behavior</div>
                    <div class="sub-menu-item" onclick="location.href='./admin-daily-active.html'">Daily Active Users</div>
                </div>
            </div>

            <div class="menu-item" onclick="location.href='.admin-analytics.html'">Analytics</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1>User Management</h1>

            <div class="toolbar">
                <label for="roleFilter">Role:</label>
                <select id="roleFilter">
                    <option value="">All</option>
                    <option value="student">Student</option>
                    <option value="employer">Employer</option>
                </select>
                <button id="loadUsersBtn">Load Users</button>
            </div>

            <div class="toolbar">
                <label for="searchInput">Search:</label>
                <input id="searchInput" type="text" placeholder="Search by name or email">
                <button id="searchBtn">Search</button>
                <button id="resetBtn">Reset</button>
            </div>

            <table id="userTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Phone</th>
                    <th>Company</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="userTableBody">
                </tbody>
            </table>

            <pre id="messageBox"></pre>
        </div>
    </main>
</div>

<script src="./js/api-client.js"></script>
<script src="./js/admin-sidebar.js"></script>
<script src="./js/admin-users.js"></script>
<script src="./js/admin-ai-assistant.js"></script>
<script src="./js/admin-logout.js"></script>
</body>
</html>
