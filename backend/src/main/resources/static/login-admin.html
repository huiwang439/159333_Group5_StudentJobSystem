<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Admin Login</h1>
        <p class="auth-subtitle">
            Sign in to access the administration panel.
        </p>

        <form>
            <div class="form-group">
                <label class="form-label" for="admin-username">Username</label>
                <input class="form-input" id="admin-username" type="text" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label class="form-label" for="admin-password">Password</label>
                <input class="form-input" id="admin-password" type="password" placeholder="Enter your password">
            </div>

            <button class="primary-btn" type="button">Log In</button>
        </form>
    </div>
</div>
</body>
</html>
