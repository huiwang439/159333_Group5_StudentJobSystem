<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Student Job Board</title>
  <style>
    :root { --bg:#f3f5f8; --surface:#fff; --text:#1a1d26; --muted:#5c6478; --border:#e2e6ef; --accent:#14b8a6; --radius:12px; --shadow:0 1px 3px rgba(26,29,38,.06),0 8px 24px rgba(26,29,38,.06); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI",Arial,sans-serif; }
    .app { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
    .sidebar { background:var(--surface); border-right:1px solid var(--border); padding:1rem .75rem; display:flex; flex-direction:column; gap:.35rem; }
    .nav-item { display:flex; gap:.55rem; align-items:center; text-decoration:none; color:#60708f; padding:.8rem; border-radius:12px; font-size:.95rem; }
    .nav-item.active { background:#e6fbf8; color:#0f766e; font-weight:600; }
    .main { padding:1.2rem 1.4rem 2rem; max-width:1220px; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:1rem; }
    .panel-hd { padding:.9rem 1rem; border-bottom:1px solid var(--border); background:linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff; }
    .panel-hd h2 { margin:0; font-size:1rem; }
    .panel-bd { padding:1rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:.65rem; }
    .field { display:flex; flex-direction:column; gap:.35rem; }
    .field.full { grid-column:1 / -1; }
    label { font-size:.8rem; color:var(--muted); }
    input, textarea, select { width:100%; border:1px solid var(--border); border-radius:8px; padding:.62rem .75rem; font-size:.86rem; font-family:inherit; }
    textarea { min-height:150px; resize:vertical; }
    .btn-row { display:flex; justify-content:flex-end; gap:.5rem; margin-top:.9rem; }
    .btn { border:none; border-radius:8px; padding:.6rem .85rem; font-weight:600; cursor:pointer; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-ghost { background:#fff; border:1px solid var(--border); }
    .doc-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .upload-card { border:1px solid var(--border); border-radius:10px; padding:.85rem; }
    .upload-card h3 { margin:.1rem 0 .5rem; font-size:.95rem; }
    .doc-list { margin-top:1rem; }
    .doc-item { display:flex; justify-content:space-between; align-items:center; gap:.55rem; border:1px solid var(--border); border-radius:10px; padding:.75rem; margin-bottom:.55rem; }
    .doc-meta { font-size:.82rem; color:var(--muted); margin-top:.2rem; }
    .tag { font-size:.7rem; padding:.2rem .45rem; border-radius:6px; font-weight:700; }
    .tag.resume { background:#dbeafe; color:#1d4ed8; }
    .tag.portfolio { background:#ede9fe; color:#6d28d9; }
    .tag.default { background:#d1fae5; color:#047857; }
    .note { font-size:.8rem; color:var(--muted); }
    @media (max-width: 900px) { .app{grid-template-columns:1fr;} .sidebar{display:none;} .form-grid,.doc-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="nav-item" href="./index.html">⌂ Dashboard</a>
    <a class="nav-item" href="./browse-jobs.html">◎ Browse Jobs</a>
    <a class="nav-item" href="./my-favorites.html">★ My Favorites</a>
    <a class="nav-item" href="./my-applications.html">→ My Applications</a>
    <a class="nav-item active" href="./profile.html">◎ Profile</a>
    <a class="nav-item" href="./notifications.html">◆ Notifications</a>
  </aside>

  <main class="main">
    <section class="panel">
      <header class="panel-hd"><h2>Basic Information</h2></header>
      <div class="panel-bd">
        <div class="form-grid">
          <div class="field"><label>Full Name</label><input id="fullName" /></div>
          <div class="field"><label>Email</label><input id="email" /></div>
          <div class="field"><label>Student Number</label><input id="studentNumber" /></div>
          <div class="field"><label>Phone</label><input id="phone" /></div>
          <div class="field"><label>Major</label><input id="major" /></div>
          <div class="field"><label>Location</label><input id="location" /></div>
          <div class="field full"><label>Bio</label><textarea id="bio"></textarea></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="reload-profile" type="button">Reload</button>
          <button class="btn btn-primary" id="save-profile" type="button">Save Profile</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <header class="panel-hd"><h2>Resume & Portfolio</h2></header>
      <div class="panel-bd">
        <div class="doc-grid">
          <article class="upload-card">
            <h3>Upload Resume</h3>
            <input type="file" id="resume-file" />
            <div class="btn-row" style="justify-content:flex-start;">
              <button class="btn btn-primary" id="upload-resume" type="button">Upload Resume</button>
            </div>
          </article>
          <article class="upload-card">
            <h3>Upload Portfolio</h3>
            <input type="file" id="portfolio-file" />
            <div class="btn-row" style="justify-content:flex-start;">
              <button class="btn btn-primary" id="upload-portfolio" type="button">Upload Portfolio</button>
            </div>
          </article>
        </div>

        <div class="doc-list" id="doc-list">
          <p class="note">Loading documents...</p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  const STUDENT_ID = 1;
  const PROFILE_API = "http://localhost:8080/api/student/profile";
  const DOC_API = "http://localhost:8080/api/student/profile/documents";

  async function loadProfile() {
    const response = await fetch(`${PROFILE_API}?studentId=${STUDENT_ID}`);
    if (!response.ok) return;
    const data = await response.json();
    ["fullName","email","studentNumber","phone","major","location","bio"].forEach(key => {
      const el = document.getElementById(key);
      el.value = data[key] ?? "";
    });
  }

  async function saveProfile() {
    const payload = {
      studentId: STUDENT_ID,
      fullName: document.getElementById("fullName").value.trim(),
      email: document.getElementById("email").value.trim(),
      studentNumber: document.getElementById("studentNumber").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      major: document.getElementById("major").value.trim(),
      location: document.getElementById("location").value.trim(),
      bio: document.getElementById("bio").value.trim()
    };
    await fetch(PROFILE_API, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    await loadProfile();
  }

  async function loadDocuments() {
    const response = await fetch(`${DOC_API}?studentId=${STUDENT_ID}`);
    if (!response.ok) return;
    const docs = await response.json();
    const list = document.getElementById("doc-list");
    if (!docs.length) {
      list.innerHTML = "<p class='note'>No documents uploaded yet.</p>";
      return;
    }
    list.innerHTML = docs.map(doc => `
      <div class="doc-item">
        <div>
          <strong>${doc.fileName}</strong>
          <div class="doc-meta">${(doc.fileSize / 1024).toFixed(1)} KB · ${new Date(doc.uploadedAt).toLocaleString()}</div>
        </div>
        <div style="display:flex;gap:.35rem;align-items:center;">
          <span class="tag ${doc.documentType === "resume" ? "resume" : "portfolio"}">${doc.documentType}</span>
          ${doc.defaultResume ? "<span class='tag default'>Default Resume</span>" : ""}
          ${doc.documentType === "resume" && !doc.defaultResume ? `<button class="btn btn-ghost" style="padding:.4rem .6rem;" data-set-default="${doc.id}">Set Default</button>` : ""}
        </div>
      </div>
    `).join("");
  }

  async function uploadFile(type, inputId) {
    const input = document.getElementById(inputId);
    if (!input.files.length) return;
    const formData = new FormData();
    formData.append("studentId", String(STUDENT_ID));
    formData.append("documentType", type);
    formData.append("defaultResume", String(type === "resume"));
    formData.append("file", input.files[0]);
    await fetch(`${DOC_API}/upload`, { method: "POST", body: formData });
    input.value = "";
    await loadDocuments();
  }

  async function setDefaultResume(documentId) {
    await fetch(`${DOC_API}/${documentId}/default-resume?studentId=${STUDENT_ID}`, { method: "PATCH" });
    await loadDocuments();
  }

  document.getElementById("save-profile").addEventListener("click", saveProfile);
  document.getElementById("reload-profile").addEventListener("click", loadProfile);
  document.getElementById("upload-resume").addEventListener("click", () => uploadFile("resume", "resume-file"));
  document.getElementById("upload-portfolio").addEventListener("click", () => uploadFile("portfolio", "portfolio-file"));
  document.getElementById("doc-list").addEventListener("click", (event) => {
    const button = event.target.closest("[data-set-default]");
    if (!button) return;
    setDefaultResume(Number(button.dataset.setDefault));
  });

  async function init() {
    await loadProfile();
    await loadDocuments();
  }
  init();
</script>
</body>
</html>
