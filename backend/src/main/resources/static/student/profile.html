<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Student Job Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/student-shell.css" />
  <style>
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:1rem; }
    .panel-hd { padding:.9rem 1rem; border-bottom:1px solid var(--border); background:linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff; }
    .panel-hd h2 { margin:0; font-size:1rem; }
    .panel-bd { padding:1rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:.65rem; }
    .field { display:flex; flex-direction:column; gap:.35rem; }
    .field.full { grid-column:1 / -1; }
    label { font-size:.8rem; color:var(--muted); }
    input, textarea, select { width:100%; border:1px solid var(--border); border-radius:8px; padding:.62rem .75rem; font-size:.86rem; font-family:inherit; }
    textarea { min-height:150px; resize:vertical; }
    .btn-row { display:flex; justify-content:flex-end; gap:.5rem; margin-top:.9rem; }
    .btn { border:none; border-radius:8px; padding:.6rem .85rem; font-weight:600; cursor:pointer; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-ghost { background:#fff; border:1px solid var(--border); }
    .doc-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .upload-card { border:1px solid var(--border); border-radius:10px; padding:.85rem; }
    .upload-card h3 { margin:.1rem 0 .5rem; font-size:.95rem; }
    .doc-list { margin-top:1rem; }
    .doc-item { display:flex; justify-content:space-between; align-items:center; gap:.55rem; border:1px solid var(--border); border-radius:10px; padding:.75rem; margin-bottom:.55rem; }
    .doc-meta { font-size:.82rem; color:var(--muted); margin-top:.2rem; }
    .tag { font-size:.7rem; padding:.2rem .45rem; border-radius:6px; font-weight:700; }
    .tag.resume { background:#dbeafe; color:#1d4ed8; }
    .tag.portfolio { background:#ede9fe; color:#6d28d9; }
    .tag.default { background:#d1fae5; color:#047857; }
    .note { font-size:.8rem; color:var(--muted); }
    @media (max-width: 900px) { .form-grid,.doc-grid{grid-template-columns:1fr;} }
  </style>
  <link rel="stylesheet" href="./css/student-ai-assistant.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <p class="brand-title">Job Board</p>
      <p class="brand-sub">Massey · Student</p>
    </div>
    <ul class="nav">
      <li><a href="./index.html"><span class="nav-ico">⌂</span> Dashboard</a></li>
      <li><a href="./browse-jobs.html"><span class="nav-ico">◎</span> Browse Jobs</a></li>
      <li><a href="./my-favorites.html"><span class="nav-ico">★</span> My Favorites</a></li>
      <li><a href="./my-applications.html"><span class="nav-ico">→</span> My Applications</a></li>
      <li><a class="active" href="./profile.html"><span class="nav-ico">◎</span> Profile</a></li>
      <li><a href="./notifications.html"><span class="nav-ico">◆</span> Notifications</a></li>
      <li><a href="javascript:void(0)" id="logout-btn"><span class="nav-ico">↩</span> Logout</a></li>
    </ul>
  </aside>
  <div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <span class="brand-title" style="font-size:0.9rem">Student Dashboard</span>
      <div style="display:flex;gap:0.35rem">
        <button type="button" class="btn btn-ghost" style="padding:0.4rem 0.65rem;font-size:0.75rem">Jobs</button>
        <button type="button" class="btn btn-primary" style="padding:0.4rem 0.65rem;font-size:0.75rem">Applications</button>
      </div>
    </nav>
    <main class="main">
    <section class="panel">
      <header class="panel-hd"><h2>Basic Information</h2></header>
      <div class="panel-bd">
        <div class="form-grid">
          <div class="field"><label>University</label><input id="university" /></div>
          <div class="field"><label>Degree Level</label><input id="degreeLevel" placeholder="e.g. Bachelor" /></div>
          <div class="field"><label>Graduation Year</label><input id="graduationYear" type="number" min="2000" max="2100" /></div>
          <div class="field"><label>Skills</label><input id="skills" placeholder="e.g. Java, SQL, React" /></div>
          <div class="field"><label>Major</label><input id="major" /></div>
          <div class="field"><label>Preferred Location</label><input id="preferredLocation" /></div>
          <div class="field"><label>Preferred Job Type</label><input id="preferredJobType" placeholder="e.g. Internship, Part-time" /></div>
          <div class="field full"><label>Bio</label><textarea id="bio"></textarea></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="reload-profile" type="button">Reload</button>
          <button class="btn btn-primary" id="save-profile" type="button">Save Profile</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <header class="panel-hd"><h2>Resume & Portfolio</h2></header>
      <div class="panel-bd">
        <div class="doc-grid">
          <article class="upload-card">
            <h3>Upload Resume</h3>
            <input type="file" id="resume-file" />
            <div class="btn-row" style="justify-content:flex-start;">
              <button class="btn btn-primary" id="upload-resume" type="button">Upload Resume</button>
            </div>
          </article>
          <article class="upload-card">
            <h3>Upload Portfolio</h3>
            <input type="file" id="portfolio-file" />
            <div class="btn-row" style="justify-content:flex-start;">
              <button class="btn btn-primary" id="upload-portfolio" type="button">Upload Portfolio</button>
            </div>
          </article>
        </div>

        <div class="doc-list" id="doc-list">
          <p class="note">Loading documents...</p>
        </div>
      </div>
    </section>
  </main>
  </div>
</div>

<script src="./js/student-shell.js"></script>
<script>
  const API_BASE = "http://localhost:8080";
  const token = localStorage.getItem("token");

  const PROFILE_API = `${API_BASE}/students/profile`;
  const DOC_API = `${API_BASE}/students/documents`;

  function authHeaders() {
    return {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    };
  }

  function authOnlyHeaders() {
    return {
      "Authorization": `Bearer ${token}`
    };
  }

  async function loadProfile() {
    const response = await fetch(PROFILE_API, {
      headers: authOnlyHeaders()
    });

    if (!response.ok) return;

    const result = await response.json();
    const data = result.data || result;

    ["university", "major", "degreeLevel", "graduationYear", "skills", "bio", "preferredLocation", "preferredJobType"].forEach(key => {
      const el = document.getElementById(key);
      if (el) el.value = data[key] ?? "";
    });
  }

  async function saveProfile() {
    const graduationYearValue = document.getElementById("graduationYear").value.trim();
    const payload = {
      university: document.getElementById("university").value.trim(),
      major: document.getElementById("major").value.trim(),
      degreeLevel: document.getElementById("degreeLevel").value.trim(),
      graduationYear: graduationYearValue ? Number(graduationYearValue) : null,
      skills: document.getElementById("skills").value.trim(),
      bio: document.getElementById("bio").value.trim(),
      preferredLocation: document.getElementById("preferredLocation").value.trim(),
      preferredJobType: document.getElementById("preferredJobType").value.trim()
    };

    const response = await fetch(PROFILE_API, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok || (result.code && result.code !== 200)) {
      alert(result.message || "Failed to save profile.");
      return;
    }

    await loadProfile();
    alert("Profile saved.");
  }

  async function loadDocuments() {
    const list = document.getElementById("doc-list");
    const response = await fetch(DOC_API, {
      headers: authOnlyHeaders()
    });

    if (!response.ok) {
      list.innerHTML = "<p class='note'>Failed to load documents.</p>";
      return;
    }

    const result = await response.json();
    const docs = result.data || result || [];

    if (!docs.length) {
      list.innerHTML = "<p class='note'>No documents uploaded yet.</p>";
      return;
    }

    list.innerHTML = docs.map(doc => `
      <div class="doc-item">
        <div>
          <strong>${doc.fileName || doc.originalFilename || ""}</strong>
          <div class="doc-meta">
            ${doc.fileSize ? (doc.fileSize / 1024).toFixed(1) + " KB" : ""}
            ${doc.uploadedAt ? " · " + new Date(doc.uploadedAt).toLocaleString() : ""}
          </div>
        </div>

        <div style="display:flex;gap:.35rem;align-items:center;">
          <span class="tag ${doc.documentType === "resume" ? "resume" : "portfolio"}">
            ${doc.documentType || ""}
          </span>

          ${doc.defaultResume ? "<span class='tag default'>Default Resume</span>" : ""}

          ${doc.documentType === "resume" && !doc.defaultResume ? `
            <button class="btn btn-ghost" style="padding:.4rem .6rem;" data-set-default="${doc.id}">
              Set Default
            </button>
          ` : ""}
        </div>
      </div>
    `).join("");
  }

  async function uploadFile(type, inputId) {
    const input = document.getElementById(inputId);
    if (!input.files.length) return;

    const formData = new FormData();
    formData.append("documentType", type);
    formData.append("file", input.files[0]);

    const response = await fetch(`${DOC_API}/upload`, {
      method: "POST",
      headers: authOnlyHeaders(),
      body: formData
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok || (result.code && result.code !== 200)) {
      alert(result.message || "Upload failed.");
      return;
    }

    input.value = "";
    await loadDocuments();
    alert("Upload success.");
  }

  async function setDefaultResume(documentId) {
    const response = await fetch(`${DOC_API}/${documentId}/default-resume`, {
      method: "PATCH",
      headers: authOnlyHeaders()
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok || (result.code && result.code !== 200)) {
      alert(result.message || "Failed to set default resume.");
      return;
    }

    await loadDocuments();
  }

  document.getElementById("save-profile").addEventListener("click", saveProfile);
  document.getElementById("reload-profile").addEventListener("click", loadProfile);

  document.getElementById("upload-resume").addEventListener("click", () => {
    uploadFile("resume", "resume-file");
  });

  document.getElementById("upload-portfolio").addEventListener("click", () => {
    uploadFile("portfolio", "portfolio-file");
  });

  document.getElementById("doc-list").addEventListener("click", (event) => {
    const button = event.target.closest("[data-set-default]");
    if (!button) return;

    setDefaultResume(Number(button.dataset.setDefault));
  });

  async function init() {
    if (!token) {
      alert("Please login first.");
      window.location.href = "../login-jobseeker.html";
      return;
    }

    await loadProfile();
    await loadDocuments();
  }

  init();
</script>
<script src="./js/student-ai-assistant.js"></script>
</body>
</html>
