<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/student-shell.css" />
  <style>
    .page-hd { margin-bottom: 1rem; }
    .page-hd h1 { margin: 0; font-size: 1.25rem; }
    .page-hd p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.88rem; }
    .events-list { max-width: 720px; }
    .event-card h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .event-desc { font-size: 0.86rem; color: #334155; margin: 0.5rem 0 0; line-height: 1.5; }
    .empty { color: var(--muted); padding: 1rem 0; }
  </style>
  <link rel="stylesheet" href="./css/student-ai-assistant.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <p class="brand-title">Job Board</p>
      <p class="brand-sub">Massey · Student</p>
    </div>
    <ul class="nav">
      <li><a href="./index.html"><span class="nav-ico">⌂</span> Dashboard</a></li>
      <li><a href="./browse-jobs.html"><span class="nav-ico">◎</span> Browse Jobs</a></li>
      <li><a href="./my-favorites.html"><span class="nav-ico">★</span> My Favorites</a></li>
      <li><a href="./my-applications.html"><span class="nav-ico">→</span> My Applications</a></li>
      <li><a href="./profile.html"><span class="nav-ico">◎</span> Profile</a></li>
      <li><a href="./notifications.html"><span class="nav-ico">◆</span><span class="nav-text">Notifications</span><span class="nav-notif-badge" id="nav-notif-badge" hidden></span></a></li>
      <li><a class="active" href="./career-events.html"><span class="nav-ico">◇</span> Career Events</a></li>
      <li><a href="./student-ai.html"><span class="nav-ico">🤖</span>AI Assistant</a></li>
      <li><a href="javascript:void(0)" id="logout-btn"><span class="nav-ico">↩</span> Logout</a></li>
    </ul>
  </aside>
  <div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <span class="brand-title" style="font-size:0.9rem">Career Events</span>
    </nav>
    <main class="main">
      <header class="page-hd">
        <h1>Career Events</h1>
        <p>Workshops, fairs, and info sessions posted by career services.</p>
      </header>
      <div class="events-list" id="events-list">
        <p class="empty">Loading events…</p>
      </div>
    </main>
  </div>
</div>

<script src="./js/student-api.js"></script>
<script src="./js/student-shell.js"></script>
<script src="./js/student-notif-badge.js"></script>
<script>
  const API = window.StudentApi;
  const token = localStorage.getItem("token");
  const listEl = document.getElementById("events-list");

  function formatDate(value) {
    if (!value) return "";
    try {
      return new Date(value).toLocaleString();
    } catch (e) {
      return String(value);
    }
  }

  async function loadEvents() {
    if (!token) {
      window.location.href = "../admin/login-jobseeker.html";
      return;
    }

    try {
      const response = await fetch(API.API_BASE + "/career-events", {
        headers: API.authHeaders(token)
      });

      if (!response.ok) {
        listEl.innerHTML = "<p class=\"empty\">Could not load events.</p>";
        return;
      }

      const result = await response.json();
      const events = API.unwrapData(result);
      const items = Array.isArray(events) ? events : [];

      if (!items.length) {
        listEl.innerHTML = "<p class=\"empty\">No upcoming career events right now.</p>";
        return;
      }

      listEl.innerHTML = items
        .map(function (ev) {
          const id = ev.id || ev.eventId;
          return (
            '<article class="event-card">' +
            "<h3>" + (ev.title || "Event") + "</h3>" +
            '<p class="event-meta">' +
            (ev.organizer ? ev.organizer + " · " : "") +
            (ev.location || "") +
            "</p>" +
            '<p class="event-meta">' +
            formatDate(ev.eventDate) +
            "</p>" +
            '<p class="event-desc">' +
            (ev.description || "") +
            "</p>" +
            "</article>"
          );
        })
        .join("");
    } catch (e) {
      listEl.innerHTML = "<p class=\"empty\">Network error loading events.</p>";
    }
  }

  loadEvents();
</script>
<script src="./js/student-ai-assistant.js"></script>
</body>
</html>
