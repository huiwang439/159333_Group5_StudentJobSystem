<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Favorites - Student Job Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/student-shell.css" />
  <style>
    .head { margin-bottom: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .head h1 { margin: 0; font-size: 1.2rem; }
    .status { color: var(--muted); font-size: 0.85rem; }
    .jobs-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.85rem; }
    .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.88rem; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 154px; }
    .job-card h3 { margin: 0; font-size: 0.95rem; }
    .job-meta { margin: 0.35rem 0; color: var(--muted); font-size: 0.82rem; }
    .job-desc { color: #334155; font-size: 0.82rem; margin: 0.35rem 0 0.6rem; }
    .job-ft { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; }
    .btn { border: none; border-radius: 8px; padding: 0.5rem 0.72rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); }
    .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 1.2rem; color: var(--muted); }
    @media (max-width: 1024px) { .jobs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 760px) { .jobs-grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="./css/student-ai-assistant.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <p class="brand-title">Job Board</p>
      <p class="brand-sub">Massey · Student</p>
    </div>
    <ul class="nav">
      <li><a href="./index.html"><span class="nav-ico">⌂</span> Dashboard</a></li>
      <li><a href="./browse-jobs.html"><span class="nav-ico">◎</span> Browse Jobs</a></li>
      <li><a class="active" href="./my-favorites.html"><span class="nav-ico">★</span> My Favorites</a></li>
      <li><a href="./my-applications.html"><span class="nav-ico">→</span> My Applications</a></li>
      <li><a href="./profile.html"><span class="nav-ico">◎</span> Profile</a></li>
      <li><a href="./notifications.html"><span class="nav-ico">◆</span> Notifications</a></li>
      <li><a href="javascript:void(0)" id="logout-btn"><span class="nav-ico">↩</span> Logout</a></li>
    </ul>
  </aside>
  <div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <span class="brand-title" style="font-size:0.9rem">Student Dashboard</span>
      <div style="display:flex;gap:0.35rem">
        <button type="button" class="btn btn-ghost" style="padding:0.4rem 0.65rem;font-size:0.75rem">Jobs</button>
        <button type="button" class="btn btn-primary" style="padding:0.4rem 0.65rem;font-size:0.75rem">Applications</button>
      </div>
    </nav>
    <main class="main">
    <div class="head">
      <h1>My Favorites</h1>
      <span class="status" id="result-info">Loading...</span>
    </div>

    <section class="jobs-grid" id="favorites-container"></section>
  </main>
  </div>
</div>

<script src="./js/student-shell.js"></script>
<script>
  const API_BASE = "http://localhost:8080";
  const token = localStorage.getItem("token");

  const container = document.getElementById("favorites-container");
  const info = document.getElementById("result-info");

  function authHeaders() {
    return {
      "Authorization": `Bearer ${token}`
    };
  }

  function getJob(item) {
    return item.job || item;
  }

  function renderFavorites(items) {
    if (!items.length) {
      container.innerHTML = "<div class='empty'>No saved jobs yet.</div>";
      info.textContent = "0 saved jobs";
      return;
    }

    container.innerHTML = items.map(item => {
      const job = getJob(item);
      const jobId = job.id || item.jobId;

      return `
        <article class="job-card">
          <h3>${job.title || ""}</h3>
          <p class="job-meta">
            ${job.companyName || ""} · ${job.location || ""} · ${job.jobType || job.employmentType || ""}
          </p>
          <p class="job-meta">Industry: ${job.industry || job.categoryName || "-"}</p>
          <p class="job-desc">${job.description || ""}</p>

          <div class="job-ft">
            <a class="btn btn-primary" href="./job-detail.html?jobId=${jobId}">View</a>
            <button class="btn btn-ghost remove-btn" data-job-id="${jobId}">Remove</button>
          </div>
        </article>
      `;
    }).join("");

    info.textContent = `${items.length} saved jobs`;
  }

  async function fetchFavorites() {
    info.textContent = "Loading...";

    try {
      const response = await fetch(`${API_BASE}/saved-jobs/my`, {
        method: "GET",
        headers: authHeaders()
      });

      if (!response.ok) {
        info.textContent = `Failed to load favorites. Status: ${response.status}`;
        container.innerHTML = "";
        return;
      }

      const result = await response.json();
      const data = result.data || result || [];

      renderFavorites(data);
    } catch (error) {
      console.error(error);
      info.textContent = "Failed to connect backend.";
    }
  }

  async function removeFavorite(jobId) {
    try {
      const response = await fetch(`${API_BASE}/saved-jobs?jobId=${jobId}`, {
        method: "DELETE",
        headers: authHeaders()
      });

      if (!response.ok) {
        alert(`Failed to remove favorite. Status: ${response.status}`);
        return;
      }

      await fetchFavorites();
    } catch (error) {
      console.error(error);
      alert("Backend connection failed.");
    }
  }

  container.addEventListener("click", (event) => {
    const button = event.target.closest(".remove-btn");
    if (!button) return;

    removeFavorite(Number(button.dataset.jobId));
  });

  if (!token) {
    alert("Please login first.");
    window.location.href = "../login-jobseeker.html";
  } else {
    fetchFavorites();
  }
</script>
<script src="./js/student-ai-assistant.js"></script>
</body>
</html>
