<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Favorites - Student Job Board</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #fff;
      --text: #1a1d26;
      --muted: #5c6478;
      --border: #e2e6ef;
      --accent: #14b8a6;
      --accent-soft: #e6fbf8;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(26, 29, 38, 0.06), 0 8px 24px rgba(26, 29, 38, 0.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .nav-item { display: flex; gap: 0.55rem; align-items: center; text-decoration: none; color: #60708f; padding: 0.8rem; border-radius: 12px; font-size: 0.95rem; }
    .nav-item.active { background: var(--accent-soft); color: #0f766e; font-weight: 600; }
    .main { padding: 1.2rem 1.4rem 2rem; max-width: 1200px; }
    .head { margin-bottom: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .head h1 { margin: 0; font-size: 1.2rem; }
    .status { color: var(--muted); font-size: 0.85rem; }
    .jobs-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.85rem; }
    .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.88rem; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 154px; }
    .job-card h3 { margin: 0; font-size: 0.95rem; }
    .job-meta { margin: 0.35rem 0; color: var(--muted); font-size: 0.82rem; }
    .job-desc { color: #334155; font-size: 0.82rem; margin: 0.35rem 0 0.6rem; }
    .job-ft { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; }
    .btn { border: none; border-radius: 8px; padding: 0.5rem 0.72rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); }
    .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 1.2rem; color: var(--muted); }
    @media (max-width: 1024px) { .jobs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .jobs-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <aside class="sidebar">
      <a class="nav-item" href="./index.html">⌂ Dashboard</a>
      <a class="nav-item" href="./browse-jobs.html">◎ Browse Jobs</a>
      <a class="nav-item active" href="./my-favorites.html">★ My Favorites</a>
      <a class="nav-item" href="./my-applications.html">→ My Applications</a>
      <a class="nav-item" href="./profile.html">◎ Profile</a>
      <a class="nav-item" href="./notifications.html">◆ Notifications</a>
    </aside>
  </aside>

  <main class="main">
    <div class="head">
      <h1>My Favorites</h1>
      <span class="status" id="result-info">Loading...</span>
    </div>

    <section class="jobs-grid" id="favorites-container"></section>
  </main>
</div>

<script>
  const FAVORITES_API = "http://localhost:8080/api/student/favorites";
  const STUDENT_ID = 1;
  const container = document.getElementById("favorites-container");
  const info = document.getElementById("result-info");

  function renderFavorites(items) {
    if (!items.length) {
      container.innerHTML = "<div class='empty'>No saved jobs yet. Go to Browse Jobs to add favorites.</div>";
      return;
    }
    container.innerHTML = items.map(job => `
      <article class="job-card">
        <h3>${job.title}</h3>
        <p class="job-meta">${job.companyName} · ${job.location} · ${job.jobType}</p>
        <p class="job-meta">Industry: ${job.industry} | Salary: ${job.salaryRange}</p>
        <p class="job-desc">${job.description}</p>
        <div class="job-ft">
          <button class="btn btn-primary">View</button>
          <button class="btn btn-ghost remove-btn" data-job-id="${job.id}">Remove</button>
        </div>
      </article>
    `).join("");
  }

  async function fetchFavorites() {
    info.textContent = "Loading...";
    const response = await fetch(`${FAVORITES_API}?studentId=${STUDENT_ID}`);
    if (!response.ok) {
      info.textContent = "Failed to load favorites.";
      container.innerHTML = "";
      return;
    }
    const data = await response.json();
    renderFavorites(data);
    info.textContent = `${data.length} saved jobs`;
  }

  async function removeFavorite(jobId) {
    const response = await fetch(`${FAVORITES_API}/${jobId}?studentId=${STUDENT_ID}`, { method: "DELETE" });
    if (!response.ok) {
      return;
    }
    fetchFavorites();
  }

  container.addEventListener("click", (event) => {
    const button = event.target.closest(".remove-btn");
    if (!button) return;
    removeFavorite(Number(button.dataset.jobId));
  });

  fetchFavorites();
</script>
</body>
</html>
