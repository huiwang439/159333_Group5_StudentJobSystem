<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Detail - Student Job Board</title>
  <style>
    :root { --bg:#f3f5f8; --surface:#fff; --text:#1a1d26; --muted:#5c6478; --border:#e2e6ef; --accent:#14b8a6; --radius:12px; --shadow:0 1px 3px rgba(26,29,38,.06),0 8px 24px rgba(26,29,38,.06);}
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1040px; margin:0 auto; padding:1rem 1rem 2rem; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:.8rem; }
    .btn { border:none; border-radius:8px; padding:.58rem .9rem; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-ghost { background:#fff; border:1px solid var(--border); color:var(--text); }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .header { padding:1rem; border-bottom:1px solid var(--border); }
    .header h1 { margin:0; font-size:1.55rem; }
    .header p { margin:.25rem 0 0; color:var(--muted); }
    .chips { display:grid; grid-template-columns:repeat(4, 1fr); gap:.55rem; padding:0 1rem 1rem; }
    .chip { border:1px solid var(--border); border-radius:9px; padding:.58rem .68rem; font-size:.84rem; color:#334155; background:#fff; }
    .body { padding:0 1rem 1rem; }
    .section-title { margin:.8rem 0 .4rem; font-size:1rem; color:#0f766e; }
    .card { border:1px solid var(--border); border-radius:10px; padding:.75rem; color:#334155; line-height:1.55; }
    .actions { padding:0 1rem 1rem; display:flex; flex-wrap:wrap; justify-content:center; gap:.55rem; align-items:center; }
    .status { font-size:.82rem; color:var(--muted); margin-top:.5rem; text-align:center; min-height:1.2rem; }
    .btn-report { background:#fff; border:1px solid #cbd5e1; color:#64748b; }
    .btn-report:hover { border-color:#94a3b8; color:#334155; background:#f8fafc; }
    .report-status { font-size:.82rem; color:var(--muted); margin-top:.35rem; text-align:center; min-height:1.2rem; }
    .modal-backdrop { display:none; position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.45); align-items:center; justify-content:center; padding:1rem; }
    .modal-backdrop.open { display:flex; }
    .modal { background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); max-width:440px; width:100%; padding:1.1rem 1.15rem; max-height:90vh; overflow:auto; }
    .modal h2 { margin:0 0 .75rem; font-size:1.1rem; }
    .modal label { display:block; font-size:.82rem; font-weight:600; color:#334155; margin:.65rem 0 .3rem; }
    .modal select, .modal textarea { width:100%; padding:.55rem .65rem; border-radius:8px; border:1px solid var(--border); font:inherit; font-size:.88rem; }
    .modal textarea { min-height:88px; resize:vertical; }
    .modal-actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; flex-wrap:wrap; }
    .modal-hint { font-size:.78rem; color:var(--muted); margin:.5rem 0 0; line-height:1.45; }
    @media (max-width: 860px){ .chips { grid-template-columns:1fr 1fr; } }
  </style>
  <link rel="stylesheet" href="./css/student-ai-assistant.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="btn btn-ghost" href="./browse-jobs.html">Back to Browse Jobs</a>
    <a class="btn btn-ghost" href="./index.html">Back to Dashboard</a>
  </div>

  <section class="panel">
    <header class="header">
      <h1 id="job-title">Loading job...</h1>
      <p id="company-name">Please wait</p>
    </header>

    <div class="chips">
      <div class="chip"><strong>Location:</strong> <span id="job-location">-</span></div>
      <div class="chip"><strong>Salary:</strong> <span id="job-salary">-</span></div>
      <div class="chip"><strong>Type:</strong> <span id="job-type">-</span></div>
      <div class="chip"><strong>Industry:</strong> <span id="job-industry">-</span></div>
    </div>

    <div class="body">
      <h2 class="section-title">Job Details</h2>
      <div class="card" id="job-description">Loading description...</div>

      <h2 class="section-title">Company Information</h2>
      <div class="card" id="company-info">Loading company info...</div>
    </div>

    <div class="actions">
      <button id="apply-btn" class="btn btn-primary" type="button">Apply Now</button>
      <button id="report-open-btn" class="btn btn-report" type="button" disabled>Report this job</button>
    </div>

    <p class="status" id="apply-status"></p>
    <p class="report-status" id="report-inline-status" aria-live="polite"></p>
  </section>
</div>

<div id="report-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
  <div class="modal">
    <h2 id="report-modal-title">Report this job</h2>
    <p class="modal-hint">Reports are reviewed by administrators. Misuse may affect your account.</p>
    <label for="report-reason">Reason <span style="font-weight:400;color:var(--muted)">(required)</span></label>
    <select id="report-reason">
      <option value="">Select a reason</option>
      <option value="Fraudulent or scam listing">Fraudulent or scam listing</option>
      <option value="Misleading job information">Misleading job information</option>
      <option value="Discrimination or harassment">Discrimination or harassment</option>
      <option value="Spam or duplicate posting">Spam or duplicate posting</option>
      <option value="Other">Other</option>
    </select>
    <label for="report-description">Additional details <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <textarea id="report-description" placeholder="Describe what is wrong (optional)"></textarea>
    <p class="modal-hint" id="report-modal-status" role="status"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="report-cancel-btn">Cancel</button>
      <button type="button" class="btn btn-primary" id="report-submit-btn">Submit report</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8080";
  const token = localStorage.getItem("token");

  const params = new URLSearchParams(window.location.search);
  const jobId = Number(params.get("jobId"));

  let currentJob = null;

  function getJobPk(job) {
    if (!job) return jobId;
    return job.jobId != null ? job.jobId : job.id != null ? job.id : jobId;
  }

  function getReportedEmployerUserId(job) {
    if (!job) return null;
    if (job.employerId != null) return job.employerId;
    if (job.employerProfile && job.employerProfile.userId != null) return job.employerProfile.userId;
    return null;
  }

  function authHeaders() {
    return {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    };
  }

  async function loadJobDetail() {
    if (!token) {
      alert("Please login first.");
      window.location.href = "../login-jobseeker.html";
      return;
    }

    if (!jobId) {
      document.getElementById("job-title").textContent = "Invalid job id";
      return;
    }

    const response = await fetch(`${API_BASE}/jobs/${jobId}`, {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    if (!response.ok) {
      document.getElementById("job-title").textContent = "Job not found";
      return;
    }

    const result = await response.json();
    currentJob = result.data || result;

    document.getElementById("job-title").textContent = currentJob.title || "";
    const companyFromProfile =
      currentJob.employerProfile && currentJob.employerProfile.companyName
        ? currentJob.employerProfile.companyName
        : "";
    document.getElementById("company-name").textContent =
      currentJob.companyName || companyFromProfile || "";
    document.getElementById("job-location").textContent = currentJob.location || "";
    document.getElementById("job-salary").textContent = currentJob.salaryRange || "";
    document.getElementById("job-type").textContent = currentJob.jobType || currentJob.employmentType || "";
    document.getElementById("job-industry").textContent = currentJob.industry || currentJob.categoryName || "";
    document.getElementById("job-description").textContent = currentJob.description || "";

    document.getElementById("company-info").textContent =
      `${currentJob.companyName || companyFromProfile || "This company"} is hiring for ${currentJob.title || "this role"} in ${currentJob.location || "N/A"}.`;

    const reportBtn = document.getElementById("report-open-btn");
    reportBtn.disabled = getReportedEmployerUserId(currentJob) == null;
  }

  async function applyNow() {
    if (!currentJob) return;

    const statusEl = document.getElementById("apply-status");
    statusEl.textContent = "Submitting application...";

    const response = await fetch(`${API_BASE}/applications`, {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        jobId: getJobPk(currentJob),
        coverLetterText: `Interested in ${currentJob.title} at ${currentJob.companyName || ""}.`
      })
    });

    if (!response.ok) {
      statusEl.textContent = "Failed to apply. Please check backend API or token.";
      return;
    }

    statusEl.textContent = "Application submitted. You can track it in My Applications.";
  }

  document.getElementById("apply-btn").addEventListener("click", applyNow);

  const reportModal = document.getElementById("report-modal");
  const reportModalStatus = document.getElementById("report-modal-status");
  const reportInlineStatus = document.getElementById("report-inline-status");

  function openReportModal() {
    if (!currentJob || getReportedEmployerUserId(currentJob) == null) return;
    document.getElementById("report-reason").value = "";
    document.getElementById("report-description").value = "";
    reportModalStatus.textContent = "";
    reportModal.classList.add("open");
  }

  function closeReportModal() {
    reportModal.classList.remove("open");
  }

  async function submitReport() {
    const reason = document.getElementById("report-reason").value.trim();
    const description = document.getElementById("report-description").value.trim();
    const reportedUserId = getReportedEmployerUserId(currentJob);
    const relatedJobId = getJobPk(currentJob);

    if (!reason) {
      reportModalStatus.textContent = "Please choose a reason.";
      return;
    }

    reportModalStatus.textContent = "Submitting…";
    const body = new URLSearchParams();
    body.set("reportedUserId", String(reportedUserId));
    body.set("relatedJobId", String(relatedJobId));
    body.set("reason", reason);
    if (description) body.set("description", description);

    try {
      const response = await fetch(`${API_BASE}/reports`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: body.toString()
      });

      const result = await response.json().catch(() => ({}));

      if (result.code === 200) {
        closeReportModal();
        reportInlineStatus.textContent = result.message || "Report submitted. Thank you.";
        return;
      }

      reportModalStatus.textContent =
        result.message || "Report could not be submitted. Please try again.";
    } catch (e) {
      reportModalStatus.textContent = "Network error. Please try again.";
    }
  }

  document.getElementById("report-open-btn").addEventListener("click", openReportModal);
  document.getElementById("report-cancel-btn").addEventListener("click", closeReportModal);
  document.getElementById("report-submit-btn").addEventListener("click", submitReport);

  reportModal.addEventListener("click", (e) => {
    if (e.target === reportModal) closeReportModal();
  });

  loadJobDetail();
</script>
<script src="./js/student-ai-assistant.js"></script>
</body>
</html>
