<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Applications - Student Job Board</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #fff;
      --text: #1a1d26;
      --muted: #5c6478;
      --border: #e2e6ef;
      --accent: #14b8a6;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(26, 29, 38, 0.06), 0 8px 24px rgba(26, 29, 38, 0.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .nav-item { display: flex; gap: 0.55rem; align-items: center; text-decoration: none; color: #60708f; padding: 0.8rem; border-radius: 12px; font-size: 0.95rem; }
    .nav-item.active { background: #e6fbf8; color: #0f766e; font-weight: 600; }
    .main { padding: 1.2rem 1.4rem 2rem; max-width: 1220px; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 1rem; }
    .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 0.95rem 1rem; }
    .sum-label { font-size: 0.85rem; color: var(--muted); }
    .sum-value { font-size: 2rem; margin-top: 0.1rem; font-weight: 700; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-hd { padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .panel-hd h2 { margin: 0; font-size: 1rem; }
    .layout { display: grid; grid-template-columns: 1.45fr 1fr; gap: 1rem; }
    .application-list { padding: 0.5rem; }
    .application-item { border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; margin-bottom: 0.55rem; cursor: pointer; }
    .application-item.active { border-color: #9ce7de; background: #f5fffd; }
    .application-item h3 { margin: 0; font-size: 0.95rem; }
    .meta { margin-top: 0.25rem; color: var(--muted); font-size: 0.82rem; }
    .row { margin-top: 0.55rem; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 0.72rem; padding: 0.22rem 0.5rem; border-radius: 6px; font-weight: 600; }
    .badge.submitted { background: #fef3c7; color: #b45309; }
    .badge.review { background: #dbeafe; color: #1d4ed8; }
    .badge.shortlisted { background: #d1fae5; color: #047857; }
    .timeline-wrap { padding: 0.9rem 1rem; }
    .detail-title { margin: 0; font-size: 0.95rem; }
    .detail-sub { margin: 0.2rem 0 0.8rem; color: var(--muted); font-size: 0.82rem; }
    .timeline { border-left: 2px solid #cdeee9; margin-left: 0.35rem; padding-left: 0.85rem; }
    .timeline-item { position: relative; margin-bottom: 0.9rem; }
    .timeline-item::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #14b8a6; position: absolute; left: -1.18rem; top: 0.28rem; }
    .timeline-status { font-size: 0.83rem; font-weight: 700; }
    .timeline-note { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }
    .timeline-time { color: var(--muted); font-size: 0.75rem; margin-top: 0.1rem; }
    .empty { color: var(--muted); font-size: 0.85rem; padding: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; margin-bottom: 0.55rem; }
    .input, .textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 0.85rem; }
    .textarea { min-height: 86px; resize: vertical; }
    .btn { border: none; border-radius: 8px; padding: 0.58rem 0.85rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); }
    .status-note { color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .summary { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="nav-item" href="./index.html">⌂ Dashboard</a>
    <a class="nav-item" href="./browse-jobs.html">◎ Browse Jobs</a>
    <a class="nav-item" href="./my-favorites.html">★ My Favorites</a>
    <a class="nav-item active" href="./my-applications.html">→ My Applications</a>
    <a class="nav-item" href="./profile.html">◎ Profile</a>
    <a class="nav-item" href="./notifications.html">◆ Notifications</a>
  </aside>

  <main class="main">
    <section class="summary">
      <article class="sum-card">
        <div class="sum-label">Applied Jobs</div>
        <div class="sum-value" id="sum-total">0</div>
      </article>
      <article class="sum-card">
        <div class="sum-label">Pending Applications</div>
        <div class="sum-value" id="sum-pending">0</div>
      </article>
    </section>

    <section class="panel" style="margin-bottom:1rem">
      <div class="panel-hd">
        <h2>Quick Apply (API demo)</h2>
        <span class="status-note">Use Job ID from Browse Jobs cards</span>
      </div>
      <div style="padding:0.9rem 1rem;">
        <div class="form-row">
          <input id="apply-job-id" class="input" placeholder="Job ID (e.g. 1)" />
          <button id="apply-btn" class="btn btn-primary" type="button">Apply</button>
        </div>
        <input id="apply-resume" class="input" placeholder="Resume file name (e.g. Resume_Alex.pdf)" style="margin-bottom:0.55rem;" />
        <textarea id="apply-note" class="textarea" placeholder="Short cover letter note"></textarea>
      </div>
    </section>

    <section class="layout">
      <section class="panel">
        <div class="panel-hd">
          <h2>Application Records</h2>
          <span class="status-note" id="list-note">Loading...</span>
        </div>
        <div class="application-list" id="application-list"></div>
      </section>

      <aside class="panel">
        <div class="panel-hd">
          <h2>Status Timeline</h2>
          <button id="refresh-btn" class="btn btn-ghost" type="button">Refresh</button>
        </div>
        <div class="timeline-wrap">
          <h3 class="detail-title" id="detail-title">Select one application</h3>
          <p class="detail-sub" id="detail-sub">Timeline will appear here.</p>
          <div class="timeline" id="timeline"></div>
        </div>
      </aside>
    </section>
  </main>
</div>

<script>
  const STUDENT_ID = 1;
  const APPLICATION_API = "http://localhost:8080/api/student/applications";
  let currentApplicationId = null;

  const listEl = document.getElementById("application-list");
  const timelineEl = document.getElementById("timeline");
  const listNote = document.getElementById("list-note");

  function statusClass(status) {
    const normalized = String(status || "").toLowerCase();
    if (normalized.includes("review")) return "review";
    if (normalized.includes("short")) return "shortlisted";
    return "submitted";
  }

  async function loadSummary() {
    const response = await fetch(`${APPLICATION_API}/summary?studentId=${STUDENT_ID}`);
    if (!response.ok) return;
    const data = await response.json();
    document.getElementById("sum-total").textContent = data.totalApplied ?? 0;
    document.getElementById("sum-pending").textContent = data.pendingCount ?? 0;
  }

  async function loadApplications() {
    listNote.textContent = "Loading...";
    const response = await fetch(`${APPLICATION_API}?studentId=${STUDENT_ID}`);
    if (!response.ok) {
      listNote.textContent = "Failed to load applications";
      listEl.innerHTML = "";
      return;
    }
    const data = await response.json();
    listNote.textContent = `${data.length} records`;

    if (!data.length) {
      listEl.innerHTML = "<div class='empty'>No applications yet. Try Quick Apply above.</div>";
      timelineEl.innerHTML = "";
      return;
    }

    listEl.innerHTML = data.map(item => `
      <article class="application-item ${currentApplicationId === item.applicationId ? "active" : ""}" data-app-id="${item.applicationId}">
        <h3>${item.jobTitle}</h3>
        <p class="meta">${item.companyName} · ${item.location} · ${item.jobType}</p>
        <div class="row">
          <span class="badge ${statusClass(item.status)}">${item.status}</span>
          <span class="status-note">${new Date(item.appliedAt).toLocaleString()}</span>
        </div>
      </article>
    `).join("");

    if (!currentApplicationId) {
      currentApplicationId = data[0].applicationId;
    }

    await loadDetail(currentApplicationId);
  }

  async function loadDetail(applicationId) {
    const response = await fetch(`${APPLICATION_API}/${applicationId}?studentId=${STUDENT_ID}`);
    if (!response.ok) {
      timelineEl.innerHTML = "<div class='empty'>Failed to load timeline.</div>";
      return;
    }

    const data = await response.json();

    document.getElementById("detail-title").textContent = `${data.application.jobTitle}`;
    document.getElementById("detail-sub").textContent = `${data.application.companyName} · Resume: ${data.application.resumeName}`;

    if (!data.timeline.length) {
      timelineEl.innerHTML = "<div class='empty'>No status updates yet.</div>";
      return;
    }

    timelineEl.innerHTML = data.timeline.map(item => `
      <div class="timeline-item">
        <div class="timeline-status">${item.oldStatus} → ${item.newStatus}</div>
        <div class="timeline-note">${item.note}</div>
        <div class="timeline-time">${new Date(item.changedAt).toLocaleString()}</div>
      </div>
    `).join("");

    document.querySelectorAll(".application-item").forEach(node => {
      node.classList.toggle("active", Number(node.dataset.appId) === Number(applicationId));
    });
  }

  async function applyJob() {
    const jobId = Number(document.getElementById("apply-job-id").value);
    if (!jobId) return;

    const resumeName = document.getElementById("apply-resume").value.trim() || "Resume_Alex.pdf";
    const coverLetterNote = document.getElementById("apply-note").value.trim() || "Looking forward to this opportunity.";

    const response = await fetch(APPLICATION_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jobId, studentId: STUDENT_ID, resumeName, coverLetterNote })
    });

    if (!response.ok) return;

    currentApplicationId = null;
    await loadSummary();
    await loadApplications();
  }

  listEl.addEventListener("click", (event) => {
    const card = event.target.closest(".application-item");
    if (!card) return;
    currentApplicationId = Number(card.dataset.appId);
    loadDetail(currentApplicationId);
  });

  document.getElementById("apply-btn").addEventListener("click", applyJob);
  document.getElementById("refresh-btn").addEventListener("click", async () => {
    await loadSummary();
    await loadApplications();
  });

  async function init() {
    await loadSummary();
    await loadApplications();
  }

  init();
</script>
</body>
</html>
