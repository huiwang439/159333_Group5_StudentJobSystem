<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications - Student Job Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/student-shell.css" />
  <style>
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .header h1 { margin:0; font-size:1.3rem; }
    .btn { border:none; border-radius:8px; padding:.55rem .85rem; cursor:pointer; font-weight:600; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-ghost { background:#fff; border:1px solid var(--border); }
    .layout { display:grid; gap:1rem; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; min-height:260px; }
    .panel-hd { padding:.9rem 1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .panel-hd h2 { margin:0; font-size:1rem; }
    .list { padding:.6rem .9rem; }
    .item { border:1px solid var(--border); border-radius:10px; padding:.78rem; margin-bottom:.55rem; background:#fff; display:flex; justify-content:space-between; align-items:flex-start; gap:.8rem; }
    .item.unread { border-color:#91e7dd; background:#f6fffd; }
    .item h3 { margin:0; font-size:.9rem; }
    .meta { margin-top:.22rem; font-size:.82rem; color:var(--muted); }
    .time { margin-top:.22rem; font-size:.75rem; color:var(--muted); }
    .tag { font-size:.68rem; padding:.2rem .45rem; border-radius:6px; font-weight:700; white-space:nowrap; }
    .tag.job { background:#dbeafe; color:#1d4ed8; }
    .tag.application { background:#ede9fe; color:#6d28d9; }
    .empty { color:var(--muted); font-size:.85rem; padding:1rem; }
  </style>
  <link rel="stylesheet" href="./css/student-ai-assistant.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <p class="brand-title">Job Board</p>
      <p class="brand-sub">Massey · Student</p>
    </div>
    <ul class="nav">
      <li><a href="./index.html"><span class="nav-ico">⌂</span> Dashboard</a></li>
      <li><a href="./browse-jobs.html"><span class="nav-ico">◎</span> Browse Jobs</a></li>
      <li><a href="./my-favorites.html"><span class="nav-ico">★</span> My Favorites</a></li>
      <li><a href="./my-applications.html"><span class="nav-ico">→</span> My Applications</a></li>
      <li><a href="./profile.html"><span class="nav-ico">◎</span> Profile</a></li>
      <li><a class="active" href="./notifications.html"><span class="nav-ico">◆</span><span class="nav-text">Notifications</span><span class="nav-notif-badge" id="nav-notif-badge" hidden></span></a></li>
      <li><a href="./career-events.html"><span class="nav-ico">◇</span> Career Events</a></li>
      <li>
        <a href="./student-ai.html">
          <span class="nav-ico">🤖</span>AI Assistant
        </a>
      </li>
      <li><a href="javascript:void(0)" id="logout-btn"><span class="nav-ico">↩</span> Logout</a></li>
    </ul>
  </aside>
  <div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <span class="brand-title" style="font-size:0.9rem">Student Dashboard</span>
      <div style="display:flex;gap:0.35rem">
        <button type="button" class="btn btn-ghost" style="padding:0.4rem 0.65rem;font-size:0.75rem">Jobs</button>
        <button type="button" class="btn btn-primary" style="padding:0.4rem 0.65rem;font-size:0.75rem">Applications</button>
      </div>
    </nav>
    <main class="main">
    <header class="header">
      <h1>Notifications</h1>
      <div style="display:flex;gap:.5rem;">
        <button id="mark-all-jobs" class="btn btn-ghost" type="button">Mark Job Alerts Read</button>
        <button id="mark-all-apps" class="btn btn-primary" type="button">Mark Status Updates Read</button>
      </div>
    </header>

    <section class="layout">
      <section class="panel">
        <div class="panel-hd">
          <h2>New Job Alerts</h2>
          <span id="job-count" class="meta">0 items</span>
        </div>
        <div class="list" id="job-list"></div>
      </section>

      <section class="panel">
        <div class="panel-hd">
          <h2>Application Status Updates</h2>
          <span id="application-count" class="meta">0 items</span>
        </div>
        <div class="list" id="application-list"></div>
      </section>
    </section>
  </main>
  </div>
</div>

<script src="./js/student-api.js"></script>
<script src="./js/student-shell.js"></script>
<script src="./js/student-notif-badge.js"></script>
<script>
  const API_BASE = "http://localhost:8080";
  const token = localStorage.getItem("token");

  function authHeaders() {
    return { Authorization: "Bearer " + token };
  }

  function normalizeItem(raw) {
    return {
      notificationId: raw.notificationId,
      title: raw.title || "",
      message: raw.message || "",
      read: !!raw.isRead,
      type: raw.notificationType || "",
      createdAt: raw.createdAt
    };
  }

  function renderItems(items, targetId, countId, emptyLabel) {
    const container = document.getElementById(targetId);
    document.getElementById(countId).textContent = `${items.length} items`;

    if (!items.length) {
      container.innerHTML = `<div class="empty">No ${emptyLabel} yet.</div>`;
      return;
    }

    container.innerHTML = items.map(item => `
      <article class="item ${item.read ? "" : "unread"}">
        <div>
          <div style="display:flex;gap:.4rem;align-items:center;">
            <h3>${item.title || ""}</h3>
            <span class="tag ${item.type === "APPLICATION_STATUS" ? "application" : "job"}">${item.type || "notice"}</span>
          </div>
          <p class="meta">${item.message || ""}</p>
          <p class="time">
            ${item.createdAt ? new Date(item.createdAt).toLocaleString() : ""}
          </p>
        </div>

        ${item.read ? "" : `
          <button class="btn btn-ghost" data-read-id="${item.notificationId}" style="padding:.35rem .6rem;">
            Mark Read
          </button>
        `}
      </article>
    `).join("");
  }

  async function loadNotifications() {
    const response = await fetch(API_BASE + "/notifications", { headers: authHeaders() });
    const result = response.ok ? await response.json() : { data: [] };
    const rawList = Array.isArray(result.data) ? result.data : [];

    const all = rawList.map(normalizeItem);
    const apps = all.filter(i => i.type === "APPLICATION_STATUS");
    const jobs = all.filter(i => i.type !== "APPLICATION_STATUS");

    renderItems(jobs, "job-list", "job-count", "other alerts");
    renderItems(apps, "application-list", "application-count", "application status updates");

    if (typeof window.refreshStudentNotifBadge === "function") {
      window.refreshStudentNotifBadge();
    }
  }

  async function markRead(notificationId) {
    await fetch(API_BASE + "/notifications/" + notificationId + "/read", {
      method: "PUT",
      headers: authHeaders()
    });
    await loadNotifications();
  }

  async function markAllInCategory(isApplication) {
    const response = await fetch(API_BASE + "/notifications", { headers: authHeaders() });
    const result = response.ok ? await response.json() : { data: [] };
    const rawList = Array.isArray(result.data) ? result.data : [];
    const all = rawList.map(normalizeItem);
    const subset = all.filter(i =>
      isApplication ? i.type === "APPLICATION_STATUS" : i.type !== "APPLICATION_STATUS"
    );
    const unread = subset.filter(i => !i.read);
    await Promise.all(
      unread.map(i =>
        fetch(API_BASE + "/notifications/" + i.notificationId + "/read", {
          method: "PUT",
          headers: authHeaders()
        })
      )
    );
    await loadNotifications();
  }

  document.body.addEventListener("click", (event) => {
    const button = event.target.closest("[data-read-id]");
    if (!button) return;
    markRead(Number(button.dataset.readId));
  });

  document.getElementById("mark-all-jobs").addEventListener("click", () => markAllInCategory(false));
  document.getElementById("mark-all-apps").addEventListener("click", () => markAllInCategory(true));

  if (!token) {
    alert("Please login first.");
    window.location.href = "../login-jobseeker.html";
  } else {
    loadNotifications();
  }
</script>
<script src="./js/student-ai-assistant.js"></script>
</body>
</html>
