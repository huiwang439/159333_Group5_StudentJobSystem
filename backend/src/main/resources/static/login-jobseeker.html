<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Login</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Job Seeker Login</h1>
        <p class="auth-subtitle">
            Sign in to browse jobs and manage your applications.
        </p>

        <form>
            <div class="form-group">
                <label class="form-label" for="jobseeker-username">Username</label>
                <input class="form-input" id="jobseeker-username" type="text" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-password">Password</label>
                <input class="form-input" id="jobseeker-password" type="password" placeholder="Enter your password">
            </div>

            <button class="primary-btn" type="button">Log In</button>
        </form>

        <div class="auth-footer">
            Do not have an account?
            <a class="auth-link" href="/register-jobseeker.html">Register Now</a>
        </div>
    </div>
</div>
</body>
</html>
