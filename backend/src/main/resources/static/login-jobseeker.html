<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Login</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Job Seeker Login</h1>
        <p class="auth-subtitle">
            Sign in to browse jobs and manage your applications.
        </p>

        <form id="jobseekerLoginForm">
            <div class="form-group">
                <label class="form-label" for="jobseeker-email">Email</label>
                <input class="form-input" id="jobseeker-email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="jobseeker-password">Password</label>
                <input class="form-input" id="jobseeker-password" type="password" placeholder="Enter your password" required>
            </div>

            <button class="primary-btn" type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Do not have an account?
            <a class="auth-link" href="/register-jobseeker.html">Register Now</a>
        </div>

        <p id="authMessage" style="margin-top: 12px;"></p>
    </div>
</div>

<script src="/js/api-client.js"></script>
<script src="/js/login-jobseeker.js"></script>
</body>
</html>
