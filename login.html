<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #f5f7fa;
        }

        /* 顶部Logo */
        .logo {
            position: absolute;
            top: 20px;
            left: 40px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 主容器 */
        .container {
            display: flex;
            height: 100%;
        }

        /* 左侧图片 */
        .left {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') no-repeat center;
            background-size: cover;
        }

        /* 右侧登录区域 */
        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 登录框 */
        .login-box {
            width: 350px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* 输入框 */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* 按钮 */
        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn {
            background: #3498db;
            color: white;
        }

        .register-btn {
            background: #ecf0f1;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* 底部文字 */
        .extra {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <!-- Logo -->
    <div class="logo">JobBoard</div>

    <div class="container">

        <!-- 左边图片 -->
        <div class="left"></div>

        <!-- 右边登录 -->
        <div class="right">
            <div class="login-box">
                <h2>Login</h2>

                <!-- 角色选择 -->
                <div class="input-group">
                    <label>Login As</label>
                    <select>
                        <option>Job Seeker</option>
                        <option>Employer</option>
                    </select>
                </div>

                <!-- 邮箱 -->
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <!-- 密码 -->
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password">
                </div>

                <!-- 按钮 -->
                <button class="btn login-btn">Login</button>
                <button class="btn register-btn">Register</button>

                <!-- 附加 -->
                <div class="extra">
                    Forgot password?
                </div>

            </div>
        </div>

    </div>

</body>
</html>
