<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Jobs - Student Job Board</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #fff;
      --text: #1a1d26;
      --muted: #5c6478;
      --border: #e2e6ef;
      --accent: #14b8a6;
      --accent-soft: #e6fbf8;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(26, 29, 38, 0.06), 0 8px 24px rgba(26, 29, 38, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .nav-item {
      display: flex;
      gap: 0.55rem;
      align-items: center;
      text-decoration: none;
      color: #60708f;
      padding: 0.8rem;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .nav-item.active { background: var(--accent-soft); color: #0f766e; font-weight: 600; }
    .main { padding: 1.2rem 1.4rem 2rem; max-width: 1200px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .search {
      padding: 0.9rem;
      display: grid;
      grid-template-columns: 1.7fr 1fr 1fr 1fr auto auto;
      gap: 0.5rem;
    }
    .search input, .search select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.62rem 0.8rem;
      font-size: 0.88rem;
      background: #fff;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.62rem 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); }
    .head {
      margin: 1rem 0 0.7rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .head h1 { margin: 0; font-size: 1.2rem; }
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
    }
    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.88rem;
      display: flex;
      flex-direction: column;
      min-height: 154px;
    }
    .job-card h3 { margin: 0; font-size: 0.95rem; }
    .job-meta { margin: 0.35rem 0; color: var(--muted); font-size: 0.82rem; }
    .job-desc { color: #334155; font-size: 0.82rem; margin: 0.35rem 0 0.6rem; }
    .job-ft { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .page {
      display: flex; justify-content: center; gap: 0.4rem; margin-top: 1rem;
    }
    .page button {
      width: 32px; height: 32px; border: 1px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer;
    }
    .page button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status { color: var(--muted); font-size: 0.85rem; }
    @media (max-width: 1024px) {
      .jobs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .jobs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="nav-item" href="./index.html">⌂ Dashboard</a>
      <a class="nav-item active" href="./browse-jobs.html">◎ Browse Jobs</a>
      <a class="nav-item" href="./my-favorites.html">★ My Favorites</a>
      <a class="nav-item" href="./my-applications.html">→ My Applications</a>
      <a class="nav-item" href="./profile.html">◎ Profile</a>
      <a class="nav-item" href="./notifications.html">◆ Notifications</a>
    </aside>
    <main class="main">
      <section class="card">
        <form class="search" id="search-form">
          <input id="keyword" placeholder="Search by job title or company" />
          <select id="location">
            <option value="">Location</option>
            <option value="Auckland">Auckland</option>
            <option value="Wellington">Wellington</option>
            <option value="Christchurch">Christchurch</option>
            <option value="Queenstown">Queenstown</option>
            <option value="Dunedin">Dunedin</option>
            <option value="Hamilton">Hamilton</option>
            <option value="Remote">Remote</option>
          </select>
          <select id="industry">
            <option value="">Industry</option>
            <option value="Technology">Technology</option>
            <option value="Finance">Finance</option>
            <option value="Education">Education</option>
            <option value="Marketing">Marketing</option>
            <option value="Hospitality">Hospitality</option>
            <option value="Logistics">Logistics</option>
            <option value="Cybersecurity">Cybersecurity</option>
          </select>
          <select id="jobType">
            <option value="">Job Type</option>
            <option value="Internship">Internship</option>
            <option value="Part-time">Part-time</option>
            <option value="Full-time">Full-time</option>
          </select>
          <button class="btn btn-primary" type="submit">Search</button>
          <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
        </form>
      </section>

      <div class="head">
        <h1>Browse Jobs</h1>
        <span class="status" id="result-info">Loading...</span>
      </div>

      <section class="jobs-grid" id="jobs-container"></section>
      <nav class="page" id="pagination"></nav>
    </main>
  </div>

  <script>
    const API_BASE = "http://localhost:8080/api/student/jobs";
    const FAVORITES_API = "http://localhost:8080/api/student/favorites";
    const STUDENT_ID = 1;
    const state = {
      page: 0,
      size: 6,
      favoriteIds: new Set()
    };

    const jobsContainer = document.getElementById("jobs-container");
    const pagination = document.getElementById("pagination");
    const resultInfo = document.getElementById("result-info");

    function getFilters() {
      return {
        keyword: document.getElementById("keyword").value.trim(),
        location: document.getElementById("location").value,
        industry: document.getElementById("industry").value,
        jobType: document.getElementById("jobType").value
      };
    }

    function buildParams() {
      const params = new URLSearchParams({ page: String(state.page), size: String(state.size) });
      const filters = getFilters();
      Object.entries(filters).forEach(([key, value]) => {
        if (value) params.set(key, value);
      });
      return params.toString();
    }

    function renderJobs(items) {
      if (!items.length) {
        jobsContainer.innerHTML = "<div class='card' style='padding:1rem'>No matching jobs found. Try different filters.</div>";
        return;
      }
      jobsContainer.innerHTML = items.map(job => `
        <article class="job-card">
          <h3><a href="./job-detail.html?jobId=${job.id}" style="color:inherit;text-decoration:none;">${job.title}</a></h3>
          <p class="job-meta">${job.companyName} · ${job.location} · ${job.jobType}</p>
          <p class="job-meta">Industry: ${job.industry} | Salary: ${job.salaryRange}</p>
          <p class="job-desc">${job.description}</p>
          <div class="job-ft">
            <a class="btn btn-primary" href="./job-detail.html?jobId=${job.id}" style="padding:0.45rem 0.7rem;font-size:0.75rem;text-decoration:none;">View</a>
            <button class="btn btn-ghost favorite-btn" data-job-id="${job.id}" style="padding:0.45rem 0.7rem;font-size:0.75rem;">${state.favoriteIds.has(job.id) ? "Unfavorite" : "Favorite"}</button>
          </div>
        </article>
      `).join("");
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }
      let html = `<button ${state.page === 0 ? "disabled" : ""} data-page="${state.page - 1}">&lt;</button>`;
      for (let i = 0; i < totalPages; i += 1) {
        html += `<button class="${i === state.page ? "active" : ""}" data-page="${i}">${i + 1}</button>`;
      }
      html += `<button ${state.page >= totalPages - 1 ? "disabled" : ""} data-page="${state.page + 1}">&gt;</button>`;
      pagination.innerHTML = html;
    }

    async function loadFavoriteIds() {
      const response = await fetch(`${FAVORITES_API}/ids?studentId=${STUDENT_ID}`);
      if (!response.ok) {
        state.favoriteIds = new Set();
        return;
      }
      const ids = await response.json();
      state.favoriteIds = new Set(ids);
    }

    async function toggleFavorite(jobId) {
      const isFavorited = state.favoriteIds.has(jobId);
      const method = isFavorited ? "DELETE" : "POST";
      const response = await fetch(`${FAVORITES_API}/${jobId}?studentId=${STUDENT_ID}`, { method });
      if (!response.ok) {
        return;
      }
      if (isFavorited) {
        state.favoriteIds.delete(jobId);
      } else {
        state.favoriteIds.add(jobId);
      }
      fetchJobs();
    }

    async function fetchJobs() {
      resultInfo.textContent = "Loading...";
      const response = await fetch(`${API_BASE}?${buildParams()}`);
      if (!response.ok) {
        resultInfo.textContent = "Failed to load jobs. Please check backend service.";
        jobsContainer.innerHTML = "";
        pagination.innerHTML = "";
        return;
      }
      const data = await response.json();
      renderJobs(data.content || []);
      renderPagination(data.totalPages || 0);
      resultInfo.textContent = `Total ${data.totalElements || 0} jobs, page ${state.page + 1}`;
    }

    document.getElementById("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      state.page = 0;
      fetchJobs();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      document.getElementById("keyword").value = "";
      document.getElementById("location").value = "";
      document.getElementById("industry").value = "";
      document.getElementById("jobType").value = "";
      state.page = 0;
      fetchJobs();
    });

    pagination.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      state.page = Number(button.dataset.page);
      fetchJobs();
    });

    jobsContainer.addEventListener("click", (event) => {
      const favoriteButton = event.target.closest(".favorite-btn");
      if (!favoriteButton) return;
      const jobId = Number(favoriteButton.dataset.jobId);
      toggleFavorite(jobId);
    });

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      document.getElementById("keyword").value = urlParams.get("keyword") || "";
      document.getElementById("location").value = urlParams.get("location") || "";
      document.getElementById("industry").value = urlParams.get("industry") || "";
      document.getElementById("jobType").value = urlParams.get("jobType") || "";
      await loadFavoriteIds();
      await fetchJobs();
    }

    init();
  </script>
</body>
</html>
